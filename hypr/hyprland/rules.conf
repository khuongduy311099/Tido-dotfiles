# Global rules
windowrule = opaque on, match:class (foot|equibop|org\.quickshell|imv|swappy)

# Float
windowrule = float on, match:class guifetch
windowrule = float on, match:class yad
windowrule = float on, match:class zenity
windowrule = float on, match:class wev
windowrule = float on, match:class (org\.gnome\.FileRoller|file-roller)
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class com\.github\.GradienceTeam\.Gradience
windowrule = float on, match:class (feh|imv|system-config-printer|org\.quickshell)
windowrule = float on, match:title (DevTools|Developer Tools|Browser Toolbox|.*Developer Tools.*)
windowrule = float on, match:class devtools

# Float, resize, center
windowrule = float on, size 60% 70%, center on, match:class foot match:title nmtui
windowrule = float on, size 70% 80%, center on, match:class org\.gnome\.Settings
windowrule = float on, size 60% 70%, center on, match:class (org\.pulseaudio\.pavucontrol|yad-icon-browser)
windowrule = float on, size 50% 60%, center on, match:class nwg-look

# Special workspaces (use workspace selectors if special: predefined)
windowrule = workspace special:sysmon, match:class btop
windowrule = workspace special:music, match:class (feishin|Spotify|Supersonic)
windowrule = workspace special:music, match:initial_title Spotify( Free)?
windowrule = workspace special:communication, match:class (teams-for-linux|slack|discord)
windowrule = workspace special:todo, match:class Todoist

# Dialogs
windowrule = float on, match:title (Select|Open)( a)? (File|Folder)(s)?
windowrule = float on, match:title File (Operation|Upload)( Progress)?
windowrule = float on, match:title .*( Properties|Export Image as PNG|GIMP Crash Debug|Save As|Library)

# Picture-in-picture
windowrule = move 100%-w-2% 100%-w-3%, keep_aspect_ratio on, float on, pin on, match:title Picture(-| )in(-| )[Pp]icture

# Steam
windowrule = rounding 10, match:class steam match:title ^$
windowrule = float on, match:class steam match:title Friends List
windowrule = immediate on, match:class steam_app_[0-9]+
windowrule = idle_inhibit always, match:class steam_app_[0-9]+

# ATLauncher
windowrule = float on, match:class com-atlauncher-App match:title ATLauncher Console

# Fusion 360
windowrule = no_blur on, match:class fusion360\.exe match:title (Fusion360|Marking Menu)

# Workspace gaps (these are workspace rules, unchanged)
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut

layerrule = animation fade, match:namespace (hyprpicker|logout_dialog|selection|wayfreeze)
layerrule = animation popin 80%, blur on, match:namespace launcher
layerrule = no_anim on, match:namespace caelestia-(border-exclusion|area-picker)
layerrule = animation fade, match:namespace caelestia-(drawers|background)
layerrule = blur on, ignore_alpha 0.57, match:namespace caelestia-drawers

# Terminal → workspace 2
windowrule = workspace 2, opacity 0.85 override, no_blur on, match:class (kitty|alacritty|foot)

# Browser → workspace 1
windowrule = workspace 1, opacity 1.0 override, match:class (firefox|chromium|brave|Google-chrome)

# VSCode → workspace 4
windowrule = workspace 4, opacity 0.95 override, no_blur on, match:class code,
windowrule = workspace 4, opacity 0.95 override, no_blur on, match:title ^(nvim).*, 

# Mail → workspace 6
windowrule = workspace 6, opacity 1.0 override, match:class outlook-for-linux

#Claude -> workspace 5
windowrule = workspace 5, opacity 1.0 override, match:class com.anthropic.Claude
